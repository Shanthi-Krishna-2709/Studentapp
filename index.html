<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        
        margin: 0;
        padding: 0%;
        box-sizing: border-box;
        
    }
    body{
        background-color: white;
        width: 100%;
        height: 100vh;
        overflow: hidden;
    }
    .first{
        width: 100%;
        height: 100vh;
        position: relative;
    
    }
    
    .header{
        text-align: center;
        font-weight: bold;    
    }
    .footer p{
        text-align: center;
        background-color: aliceblue;
        height:15vh;
        width: 100%;
        position: absolute;
        justify-content: center;
        align-items: center;
        padding: 15px;
        margin-top: 10px;
     
    }
    input{
        width:60vw;
        height: 8vh;
        margin-left: 180px;
        margin-top: 15px;
        border-radius: 4px;
        border: 1px solid grey;
    }
    h2{
        margin-top: 20px;
        margin-left: 180px;
        margin-bottom: 10px;
    }
    .card{
        border: 1px solid lightgray;
        padding: 15px;
        padding-top: 5px;
        margin-bottom: 10px;
        border-radius: 8px;
        margin-left: 180px;
        width: 60vw;
        height: 8vh;
    

    }
    @media screen and (max-width: 768px){

    input{
        width: 90%;
        margin-left: 20px;
    }

    h2{
        margin-left: 20px;
    }

    .card{
        width: 90%;
        margin-left: 20px;
    }

    .footer p{
        height: auto;
        padding: 20px;
    }

}
</style>
<body>
    <div class="first">
    <header class="header">
    <h1>Student Search App</h1>
    </header>
    <section>
        <input id="search" type="text" placeholder="Search Student" >
        <h2>Student List</h2>
        <div class="card">Arun</div>
        <div class="card">Priya</div>
        <div class="card">Kavin</div>
        <div class="card">Sneha</div>
        <div class="card">Rahul</div>
        

    </section>
    
    <footer class="footer">
        <p>@ 2024 Student App</p>
    </footer>
    </div>
    
    <script>
        const searchInput = document.getElementById("search");
        const studentCards = document.querySelectorAll(".card");
        searchInput.addEventListener("input",function(){
            const searchValue = searchInput. value.toLowerCase();
            studentCards.forEach(function(card){
                const studentName = card.textContent.toLowerCase();
                if(studentName.includes(searchValue)){
                    card.style.display = "block";
                }
                else{


                    
                    card.style.display = "none";
                }
            });

        });



    </script>
</body>
</html>
